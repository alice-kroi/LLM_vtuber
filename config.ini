[bilibili]
room_id = 904823
# SESSDATA 从环境变量 BILIBILI_SESSDATA 读取 (留空则使用环境变量)
sessdata = 
danmaku_duration = 10
danmaku_capture_interval = 0.1
danmaku_batch_size = 10
danmaku_max_queue_size = 1000

[response]
enabled = true
sensitivity = 0.7
cooldown = 5
max_length = 200

[live2d]
enabled = false
host = localhost
port = 8001
http_port = 8888
sensitivity = 1.0
response_speed = 2.5
smoothness = 0.8
eye_tracking = true
expression = true

[tts]
enabled = false
port = 9880

[cloud_tts]
enabled = false
provider = doubao
api_version = v3

# ===== 认证配置 =====
# API Key 会自动从环境变量 TTS_KEY 读取 (豆包语音服务 Access Token)
# 备选: DOUBAO_API_KEY, VOLCENGINE_API_KEY, ARK_API_KEY
# 如需覆盖环境变量，可在此处填写 (留空则使用环境变量)
api_key = 

# 可选: 旧版控制台 APPID + Access Token (留空则使用环境变量)
appid = 
access_token = 

# ===== 豆包 TTS 参数 =====
# V3 API 端点 (HTTP 单向流式)
api_url = 
# 资源ID: seed-tts-2.0 (2.0大模型) / seed-tts-1.0 (1.0)
resource_id = seed-tts-2.0
# 音色 (V2 格式: zh_female_xxx_uranus_bigtts / zh_male_xxx_uranus_bigtts)
# 列表: https://www.volcengine.com/docs/6561/1257544
voice_type = zh_female_vv_uranus_bigtts

# ===== 通用参数 =====
speed = 1.0
volume = 1.0
sample_rate = 24000
format = pcm
timeout = 30
retry_count = 3
retry_interval = 1.0

[connection]
timeout = 30
reconnect_attempts = 5
reconnect_interval = 5

[api]
rate_limit = 10
retry_attempts = 3
retry_interval = 1.0

[model]
model = doubao-seed-1-8-251228
temperature = 0.7
max_tokens = 1000

[browser]
enabled = true
headless = true
timeout = 30
search_engine = bing
max_content_length = 5000
tool_timeout = 60

[vision]
enabled = true
default_window = 
screenshot_dir = ./screenshots
model = doubao-seed-1-6-vision-250815
api_url = 
timeout = 60

[webui]
enabled = true
history_size = 500
session_timeout = 3600

[milvus]
uri = http://localhost:19530
# Token 从环境变量 MILVUS_TOKEN 读取 (留空则使用环境变量)
token = 
database = LLM_vtuber

[minio]
endpoint = localhost:9000
# Access Key / Secret Key 从环境变量 MINIO_ACCESS_KEY / MINIO_SECRET_KEY 读取 (留空则使用环境变量)
access_key = 
secret_key = 
secure = false
bucket = knowledge-files

[context]
max_tokens = 4096
system_reserved_tokens = 512
max_history_messages = 20
summarizer_enabled = true
summarizer_threshold = 3000
rag_enabled = true
rag_max_documents = 3
memory_enabled = true
memory_max_messages = 10

[danmu_tts]
enabled = false
read_interval = 2
max_text_length = 100
clean_emoji = true

[vision_danmu]
enabled = false
capture_interval = 5
target_window = 
persona = 你是一个有趣的AI观众，观看直播时会发表简短的弹幕评论。请用20-30字的中文评论当前画面内容，风格活泼自然。
max_comment_length = 30
cooldown = 10


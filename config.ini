[rag]
# 知识库检索归思维脑（LLM_v2/core/will_knowledge.py）；主播脑只读共享缓存
knowledge_enabled = true
knowledge_top_k = 3
knowledge_collection = knowledge_chunks
# 思维脑发布的知识缓存：主播脑读取时最长等待秒数 / 缓存有效期（秒）
knowledge_hub_wait = 2.5
knowledge_hub_ttl = 90
# 思维脑没有为这条消息检索时，主播脑只等这么久（避免短句被拖慢）
knowledge_hub_grace = 0.2
# 命中分数低于此值视为"知识缺口"（实测：离题 top1≈0.69，在题 top1≈0.79+）
knowledge_gap_min_score = 0.76
# rerank：把候选块交给 rerank 判断「哪几段真正回答了问题」
# 解决"泛化综述页"因语义居中压过具体章节的问题
# rerank_enabled=false 可一键关闭
rerank_enabled = true
# backend: auto（有本地模型就用本地，否则用 LLM）/ local / llm / off
rerank_backend = auto
# 本地 cross-encoder 模型目录（scripts/download_reranker.py 下载到这里）
rerank_model_path = models/bge-reranker-v2-m3
# auto / cuda / cpu
rerank_device = auto
rerank_max_length = 512
# 启动预热本地 rerank 模型（约 2GB 显存、首次加载约 10s）
# 默认关闭：不预热时首个知识问题会边加载边回退原顺序，之后自动生效
rerank_warmup = false
# 召回池（hybrid 结果数）要明显大于 rerank 候选数，否则具体章节进不了候选
knowledge_recall_pool = 20
rerank_candidates = 10
rerank_timeout = 3.0
rerank_snippet_chars = 400
# P1 混合检索：向量候选 + 词法候选（BM25 + RRF 融合）
# 关闭后只做纯向量检索
hybrid_enabled = true
# 向量候选池大小（融合前）
hybrid_pool = 40
# 词法候选上限（Milvus content like 查询）
hybrid_lexical_limit = 200
# 单次查询参与 like 过滤的词面数量上限
hybrid_max_terms = 10
# RRF 融合常数 k
hybrid_rrf_k = 60
# 词法排名权重（dense 固定 1.0）；过大时词面命中会压过语义相关块
hybrid_lexical_weight = 0.1
# 词法命中门槛：低于池内最强命中该比例的块不参与融合
hybrid_lexical_min_ratio = 0.5


[cloud_tts]
enabled = false
provider = doubao
api_version = v3

# ===== 认证配置 =====
# API Key 会自动从环境变量 TTS_KEY 读取 (豆包语音服务 Access Token)
# 备选: DOUBAO_API_KEY, VOLCENGINE_API_KEY, ARK_API_KEY
# 如需覆盖环境变量，可在此处填写 (留空则使用环境变量)
api_key = 

# 可选: 旧版控制台 APPID + Access Token (留空则使用环境变量)
appid = 
access_token = 

# ===== 豆包 TTS 参数 =====
# V3 API 端点 (HTTP 单向流式)
api_url = 
# 资源ID: seed-tts-2.0 (2.0大模型) / seed-tts-1.0 (1.0)
resource_id = seed-tts-2.0
# 音色 (V2 格式: zh_female_xxx_uranus_bigtts / zh_male_xxx_uranus_bigtts)
# 列表: https://www.volcengine.com/docs/6561/1257544
voice_type = zh_female_vv_uranus_bigtts

# ===== 通用参数 =====
speed = 1.0
volume = 1.0
sample_rate = 24000
format = wav
timeout = 30
retry_count = 3
retry_interval = 1.0

[connection]
timeout = 30
reconnect_attempts = 5
reconnect_interval = 5

[api]
rate_limit = 10
retry_attempts = 3
retry_interval = 1.0

[model]
# ---- 当前主语言模型（火山方舟 Coding 端点，OpenAI 兼容格式）----
# 端点：https://ark.cn-beijing.volces.com/api/coding/v3
# 密钥：环境变量 LLM_API_KEY（放在 .env / 用户环境变量，不写在这里）
# 说明：原指定别名 ark-code-latest 在流式调用返回 404，故直接使用真实模型名
# （ark-code-latest 实际路由到 deepseek-v4.1-flash-economy）
model = deepseek-v4.1-flash-economy
temperature = 0.7
# max_tokens 是「单次输出上限」，不是上下文窗口
max_tokens = 2048
streamer_max_tokens = 1024
will_max_tokens = 1024
operator_max_tokens = 4096
coding_max_tokens = 8192
# 主播/适配器内置历史缓存的裁剪上限（字符数）
history_max_chars = 20000
# 按用途路由（环境变量优先于本段）：
#   streamer_model  → 主播脑（数字人对话）
#   will_model      → 意志脑（决策）
#   operator_model  → 操作脑（执行推理）
#   coding_model    → 编码循环（写代码/改代码）
streamer_model = deepseek-v4.1-flash-economy
will_model = deepseek-v4.1-flash-economy
operator_model = deepseek-v4.1-flash-economy
coding_model = deepseek-v4.1-flash-economy

# ---- 备份：切换前的配置（2026-11-03，保留以便回滚）----
# 端点：https://ark.cn-beijing.volces.com/api/v3
# 密钥：环境变量 Doubao_API_KEY（用户环境变量仍保留，未删除）
# model = doubao-seed-character-260628
# streamer_model = doubao-seed-character-260628
# will_model = doubao-seed-character-260628
# operator_model = doubao-seed-2-0-code-preview-260215
# coding_model = doubao-seed-2-0-code-preview-260215

[ocr]
# 凭证二选一（放 .env，不要写这里）：
#   VOLC_API_KEY                      → AI MediaKit（Bearer，需控制台开通能力）
#   VOLC_ACCESSKEY / VOLC_SECRETKEY   → 通用文字识别 OCRNormal（IAM 签名）
# 注意都不是方舟的 Doubao_API_KEY。
# 线路选择：auto=有 AK/SK 走 OCRNormal（base64 直传），否则用 API Key
#   volc     = 强制 IAM Access Key 签名（OCRNormal，base64 直传）
#   mediakit = 强制 API Key（Bearer，需先上传 mediakit://）
provider = auto
# default=中英文；auto=多语种（日语等场景改成 auto）
mode = default
filter_thresh = 80
timeout = 15
# 扫描版 PDF：渲染分辨率与单次最多页数（100 页约 0.35 元）
pdf_dpi = 200
pdf_max_pages = 100

[browser]
enabled = true
headless = true
timeout = 30
search_engine = bing
max_content_length = 5000
tool_timeout = 60

# ===== Edge 交互浏览器 (EdgeAgent) =====
# true 时启用 TRAE 同款 Edge 交互浏览器（带 snapshot/@ref/click/type 等）
# false 时只启动传统 headless 浏览器（web_search / fetch_webpage）
edge_interactive = true
# 模式: headed = 可见 Edge 窗口 / headless = 后台静默 / cdp = 连接已有 Edge
mode = headed
# cdp_url (仅 mode=cdp 时用): Edge 需先带 --remote-debugging-port=9222 启动
cdp_url = 
# 浏览器通道: msedge (系统 Edge) 或 chrome
channel = msedge
# headed 模式下是否最大化窗口
start_maximized = true

[vision]
enabled = true
default_window = 
screenshot_dir = ./screenshots
model = doubao-seed-2-0-code-preview-260215
api_url = 
timeout = 60

[webui]
